name: Deploy Back4App Cloud Code

on:
  push:
    branches: [main]
    paths:
      - cloud/main.js
      - .github/workflows/deploy-cloud.yml
      - .github/scripts/deploy-back4app-cloud.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: back4app-cloud-code
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BACK4APP_ACCOUNT_KEY: ${{ secrets.BACK4APP_ACCOUNT_KEY }}
      BACK4APP_APPLICATION_ID: ${{ secrets.BACK4APP_APPLICATION_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Back4App secrets are available
        run: |
          test -n "$BACK4APP_ACCOUNT_KEY"
          test -n "$BACK4APP_APPLICATION_ID"

      - name: Install Back4App MCP deployment server
        run: |
          mcp_dir="$RUNNER_TEMP/back4app-mcp"
          npm install --prefix "$mcp_dir" --no-package-lock --ignore-scripts \
            @back4app/mcp-server-back4app@0.1.9
          echo "BACK4APP_MCP_SERVER_PATH=$mcp_dir/node_modules/@back4app/mcp-server-back4app/dist/index.js" >> "$GITHUB_ENV"

      - name: Validate Cloud Code syntax
        run: |
          node --check cloud/main.js

      - name: Deploy cloud/main.js
        run: node .github/scripts/deploy-back4app-cloud.mjs
